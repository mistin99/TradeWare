services:
  app:
    build: .
    container_name: tradeware_app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

    volumes:
      - .:/app

    command: >
      python -m uvicorn trade_ware.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  db:
    image: postgres:18.4

    container_name: tradeware_db

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: